# Database bridge: runs bridge/plan.json against Supabase with the service key (allowlisted database
# functions and tables only, see site/scripts/db-bridge.mjs) and commits what it read and returned to
# bridge/out/. For sessions without a direct database connection. Run by hand.
name: Database bridge

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Plan file in the repository'
        default: 'bridge/plan.json'

permissions:
  contents: write

concurrency:
  group: db-bridge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run plan
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node site/scripts/db-bridge.mjs "${{ inputs.plan || 'bridge/plan.json' }}"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/out
          git commit -m "Database bridge: $(date -u +%FT%H:%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
