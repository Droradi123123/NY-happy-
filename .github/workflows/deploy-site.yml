# Builds yaynyc.com from Supabase and deploys it to Cloudflare Workers (static assets).
# Runs twice a day (ended parties drop off, new data and photos go live) and on demand
# from the Actions tab. Without a Cloudflare token here, the scheduled run checks the
# build on live data and, if it passes, pushes a one-line stamp (site/.rebuild): the
# push is what makes Cloudflare Workers Builds rebuild and deploy the site.
#
# Needs, in GitHub > Settings > Secrets and variables > Actions:
#   secret   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable PUBLIC_GA_ID           (G-XXXXXXX; optional, no analytics without it)
name: Deploy yaynyc.com

on:
  push:
    # the production branch: every push that changes the site is built on live data here (the build gate
    # runs), and deployed from here once CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are set
    branches: [claude/lucid-keller-2hsgwn]
    paths: ['site/**', '.github/workflows/deploy-site.yml']
  schedule:
    # every 4 hours: ended parties drop off and re-checked deals show their new dates
    # (GitHub may start a scheduled run late; party cards also hide themselves in the browser)
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      audit:
        description: 'Only run Lighthouse (mobile) on the live site and print the scores'
        type: boolean
        default: false

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audit
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse on the live site (mobile)
        run: |
          for u in / /parties /happy-hours/tuesday /parties/halloween /bars/the-stag-s-head; do
            npx -y lighthouse@12 "https://yaynyc.com$u" --quiet --form-factor=mobile --output=json --output-path=lh.json \
              --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless=new --no-sandbox" || continue
            node -e '
              const r = require("./lh.json"), a = r.audits;
              const s = Object.values(r.categories).map((c) => `${c.id} ${Math.round(c.score * 100)}`).join(" | ");
              console.log(`\n## ${r.finalDisplayedUrl}\n${s}`);
              console.log(["first-contentful-paint","largest-contentful-paint","total-blocking-time","cumulative-layout-shift","speed-index"].map((k) => `${k}: ${a[k].displayValue}`).join(" | "));
              const lcp = a["largest-contentful-paint-element"]?.details?.items?.[0]?.items?.[0]?.node?.snippet; if (lcp) console.log("LCP element:", lcp.slice(0, 160));
              for (const x of Object.values(a)) if (x.score !== null && x.score < 0.9 && x.scoreDisplayMode !== "informative" && x.scoreDisplayMode !== "notApplicable")
                console.log(`- ${x.id}: ${x.title}${x.displayValue ? ` (${x.displayValue})` : ""}`);
              for (const it of (a["layout-shifts"]?.details?.items ?? []).slice(0, 5)) console.log(`    shift ${(it.score ?? 0).toFixed(3)}: ${(it.node?.snippet ?? "").slice(0, 150)}`);
              for (const k of ["color-contrast", "heading-order", "button-name"]) for (const it of (a[k]?.details?.items ?? []).slice(0, 6))
                console.log(`    ${k}: ${(it.node?.snippet ?? "").slice(0, 150)} ${(it.node?.explanation ?? "").split("\n").pop().slice(0, 120)}`);'
          done

  deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # photos are downloaded once and kept between builds (Wikimedia asks for gentle use)
      - uses: actions/cache@v4
        with:
          path: site/public/img
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      - name: Deploy to Cloudflare
        if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ask Cloudflare to rebuild
        if: ${{ github.event_name == 'schedule' && vars.CLOUDFLARE_ACCOUNT_ID == '' }}
        working-directory: .
        run: |
          date -u +%Y-%m-%dT%H:%MZ > site/.rebuild
          node site/scripts/ended-redirects.mjs --ledger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/.rebuild site/src/data/party-ledger.json
          git commit -m "Scheduled rebuild: fresh parties, prices and photos"
          git push origin HEAD:${{ github.ref_name }}
