# Tells IndexNow (Bing, ChatGPT search, Yandex...) and Bing Webmaster Tools about every page in the
# live sitemap. Daily (approved Oct 27: Bing's 100-URL quota and IndexNow, the index behind
# ChatGPT search) and by hand after big content changes. Logs statuses only.
name: Search engine ping

on:
  schedule:
    - cron: '41 11 * * *' # daily 7:41am New York (6:41 in winter), after the overnight rebuilds
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node site/scripts/search-ping.mjs
